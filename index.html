<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VA Live Flight Radar</title>
  <link rel="stylesheet" href="./leaflet.css" />
  <style>
    html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; background: #090e1a; font-family: system-ui, -apple-system, sans-serif; }
    .plane-icon { font-size: 22px; text-align: center; line-height: 24px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.85)); }
    .leaflet-popup-content-wrapper { background: #1e293b; color: #f8fafc; border-radius: 8px; border: 1px solid #334155; }
    .leaflet-popup-tip { background: #1e293b; }
    .popup-header { font-size: 14px; font-weight: 700; color: #38bdf8; margin-bottom: 4px; }
    .popup-row { font-size: 12px; line-height: 1.5; color: #cbd5e1; }
    .popup-row b { color: #f8fafc; }
    .radar-badge { position: absolute; top: 12px; right: 12px; z-index: 1000; background: rgba(15, 23, 42, 0.92); color: #38bdf8; border: 1px solid #334155; border-radius: 6px; padding: 8px 14px; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="radar-badge" id="flight-counter">Loading radar...</div>
  <script src="./leaflet.js"></script>
  <script>
    window.addEventListener('load', async function() {
      const badge = document.getElementById('flight-counter');

      // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL (.../exec) BETWEEN THE SINGLE QUOTES BELOW:
      const LIVE_API_URL = 'https://script.google.com/macros/s/AKfycbz5gHv3EoqpVUevfHUH1vYFMX1UKfRatVu2GXgLeSiBSrPAKlUv2LBjapJrSg5Ghgw/exec';

      const map = L.map('map', { worldCopyJump: true }).setView(new Array(15.0, 20.0), 2);

      try {
        const geoResp = await fetch('./world.geojson');
        if (geoResp.ok) {
          L.geoJSON(await geoResp.json(), { style: { fillColor: '#1e293b', fillOpacity: 1, color: '#334155', weight: 1 } }).addTo(map);
        }
      } catch (e) {}

      const flightLayer = L.layerGroup().addTo(map);
      const toRad = d => d * Math.PI / 180;
      const toDeg = r => r * 180 / Math.PI;

      function toMins(val) {
        if (!val) return 0;
        const s = String(val).trim();
        if (s.includes(':')) {
          const p = s.split(':').map(Number);
          return p.length === 3 ? p.at(0) * 60 + p.at(1) + p.at(2) / 60 : p.at(0) * 60 + p.at(1);
        }
        const n = parseFloat(s);
        return isNaN(n) ? 0 : n * 60;
      }

      function angDist(a, b) {
        const lat1 = toRad(a.lat), lon1 = toRad(a.lon), lat2 = toRad(b.lat), lon2 = toRad(b.lon);
        return toDeg(2 * Math.asin(Math.sqrt(Math.pow(Math.sin((lat1 - lat2) / 2), 2) + Math.cos(lat1) * Math.cos(lat2) * Math.pow(Math.sin((lon1 - lon2) / 2), 2))));
      }

      function curveRoute(rawPts) {
        const dep = rawPts.at(0), arr = rawPts.at(rawPts.length - 1);
        const span = Math.max(angDist(dep, arr), 20);
        const maxJump = Math.min(Math.max(span * 0.65, 25), 75);
        const clean = new Array(dep);
        for (let i = 1; i < rawPts.length - 1; i++) {
          const pt = rawPts.at(i), prev = clean.at(clean.length - 1);
          if (angDist(prev, pt) <= maxJump && angDist(pt, arr) <= span * 1.25) clean.push(pt);
        }
        clean.push(arr);

        const out = new Array(); let lonShift = 0;
        for (let i = 0; i < clean.length - 1; i++) {
          const p1 = clean.at(i), p2 = clean.at(i + 1);
          const lat1 = toRad(p1.lat), lon1 = toRad(p1.lon), lat2 = toRad(p2.lat), lon2 = toRad(p2.lon);
          const d = toRad(angDist(p1, p2));
          for (let s = 0; s <= 16; s++) {
            if (i > 0 && s === 0) continue;
            const f = s / 16;
            let lat = p1.lat, lon = p1.lon;
            if (d > 1e-6) {
              const A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
              const x = A * Math.cos(lat1) * Math.cos(lon1) + B * Math.cos(lat2) * Math.cos(lon2);
              const y = A * Math.cos(lat1) * Math.sin(lon1) + B * Math.cos(lat2) * Math.sin(lon2);
              const z = A * Math.sin(lat1) + B * Math.sin(lat2);
              lat = toDeg(Math.atan2(z, Math.sqrt(x * x + y * y)));
              lon = toDeg(Math.atan2(y, x));
            }
            if (out.length > 0) {
              const diff = (lon + lonShift) - out.at(out.length - 1).lon;
              if (diff > 180) lonShift -= 360;
              else if (diff < -180) lonShift += 360;
            }
            out.push({ lat: lat, lon: lon + lonShift });
          }
        }
        return { path: out, wps: clean };
      }

      async function updateFlights() {
        if (!LIVE_API_URL.startsWith('http')) {
          badge.textContent = 'Error: Paste your Web App URL in index.html';
          return;
        }
        try {
          const sep = LIVE_API_URL.includes('?') ? '&' : '?';
          const resp = await fetch(LIVE_API_URL + sep + 't=' + Date.now());
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const rows = await resp.json();

          flightLayer.clearLayers();
          let activeCount = 0;

          for (let i = 1; i < rows.length; i++) {
            const r = rows.at(i);
            if (!r || r.length < 22 || !r.at(21)) continue;
            let raw; try { raw = JSON.parse(r.at(21)); } catch (e) { continue; }
            if (!Array.isArray(raw) || raw.length < 2) continue;

            const leftMin = toMins(r.at(13)), elapMin = toMins(r.at(14)), eftMin = toMins(r.at(8));
            if (leftMin <= 0) continue;
            const totMin = (elapMin + leftMin) > 0 ? (elapMin + leftMin) : eftMin;
            if (totMin <= 0) continue;
            const prog = Math.min(Math.max(elapMin / totMin, 0), 1);

            activeCount++;
            const built = curveRoute(raw);
            const pts = built.path, wps = built.wps;
            const latLngs = pts.map(p => new Array(p.lat, p.lon));

            L.circleMarker(new Array(pts.at(0).lat, pts.at(0).lon), { radius: 4, color: '#22c55e', fillColor: '#22c55e', fillOpacity: 1 }).bindTooltip('DEP: ' + r.at(6)).addTo(flightLayer);
            L.circleMarker(new Array(pts.at(pts.length - 1).lat, pts.at(pts.length - 1).lon), { radius: 4, color: '#ef4444', fillColor: '#ef4444', fillOpacity: 1 }).bindTooltip('ARR: ' + r.at(7)).addTo(flightLayer);
            for (let w = 1; w < wps.length - 1; w++) {
              L.circleMarker(new Array(wps.at(w).lat, wps.at(w).lon), { radius: 2.5, color: '#7dd3fc', fillColor: '#7dd3fc', fillOpacity: 0.75 }).bindTooltip(wps.at(w).ident).addTo(flightLayer);
            }
            L.polyline(latLngs, { color: '#38bdf8', weight: 2, dashArray: '5, 8', opacity: 0.8 }).addTo(flightLayer);

            const exact = prog * (pts.length - 1);
            const idx = Math.min(Math.floor(exact), pts.length - 2), frac = exact - idx;
            const p1 = pts.at(idx), p2 = pts.at(idx + 1);
            const cLat = p1.lat + (p2.lat - p1.lat) * frac, cLon = p1.lon + (p2.lon - p1.lon) * frac;
            const dLon = toRad(p2.lon - p1.lon);
            const hdg = (toDeg(Math.atan2(Math.sin(dLon) * Math.cos(toRad(p2.lat)), Math.cos(toRad(p1.lat)) * Math.sin(toRad(p2.lat)) - Math.sin(toRad(p1.lat)) * Math.cos(toRad(p2.lat)) * Math.cos(dLon))) + 360) % 360;

            const icon = L.divIcon({ className: 'plane-icon', html: `<div style="transform: rotate(${hdg - 45}deg);">✈️</div>`, iconSize: new Array(24, 24), iconAnchor: new Array(12, 12) });
            L.marker(new Array(cLat, cLon), { icon: icon }).bindPopup(`<div class="popup-header">${r.at(2)} • ${r.at(6)} ➔ ${r.at(7)}</div><div class="popup-row"><b>Pilot:</b> ${r.at(1)}</div><div class="popup-row"><b>Aircraft:</b> ${r.at(3)} (${r.at(4)})</div><div class="popup-row"><b>Livery:</b> ${r.at(5)}</div><div class="popup-row"><b>Elapsed / Left:</b> ${r.at(14)} / ${r.at(13)} (${Math.round(prog * 100)}%)</div>`).addTo(flightLayer);
          }
          badge.textContent = `${activeCount} Active Flight${activeCount === 1 ? '' : 's'}`;
        } catch (err) {
          badge.textContent = 'Radar feed error';
        }
      }

      await updateFlights();
      setInterval(updateFlights, 15000);
    });
  </script>
</body>
</html>
