<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VA Live Flight Radar</title>
  <link rel="stylesheet" href="./leaflet.css" />
  <style>
    html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; background: #090e1a; font-family: system-ui, -apple-system, sans-serif; }
    .plane-icon { font-size: 22px; text-align: center; line-height: 24px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.85)); cursor: pointer; }
    .leaflet-popup-content-wrapper { background: #1e293b; color: #f8fafc; border-radius: 8px; border: 1px solid #334155; }
    .leaflet-popup-tip { background: #1e293b; }
    .popup-header { font-size: 14px; font-weight: 700; color: #38bdf8; margin-bottom: 4px; }
    .popup-row { font-size: 12px; line-height: 1.5; color: #cbd5e1; }
    .popup-row b { color: #f8fafc; }
    .radar-badge { position: absolute; top: 12px; right: 12px; z-index: 1000; background: rgba(15, 23, 42, 0.92); color: #38bdf8; border: 1px solid #334155; border-radius: 6px; padding: 8px 14px; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="radar-badge" id="flight-counter">Loading radar...</div>
  <script src="./leaflet.js"></script>
  <script type="module">
    const DISCORD_CLIENT_ID = '1574685828318363739';
    if (window.location.search.includes('frame_id=') && DISCORD_CLIENT_ID.startsWith('1')) {
      try {
        const sdkHost = 'esm' + '.sh';
        const { DiscordSDK } = await import('https://' + sdkHost + '/@discord/embedded-app-sdk@1.9.0');
        const discordSdk = new DiscordSDK(DISCORD_CLIENT_ID);
        await discordSdk.ready();
      } catch (e) {
        console.warn('Discord SDK init skipped:', e);
      }
    }
  </script>
  <script>
    window.addEventListener('load', async function() {
      const badge = document.getElementById('flight-counter');

      const EXEC_PATH = '/macros/s/AKfycbz5gHv3EoqpVUevfHUH1vYFMX1UKfRatVu2GXgLeSiBSrPAKlUv2LBjapJrSg5Ghgw/exec';
      const isDiscord = window.location.hostname.includes('discordsays.com');
      const scriptHost = 'script' + '.google.com';
      const LIVE_API_URL = isDiscord ? ('/api' + EXEC_PATH) : ('https://' + scriptHost + EXEC_PATH);

      const map = L.map('map', { worldCopyJump: true }).setView(new Array(15.0, 20.0), 2);

      try {
        const geoResp = await fetch('./world.geojson');
        if (geoResp.ok) {
          L.geoJSON(await geoResp.json(), { style: { fillColor: '#1e293b', fillOpacity: 1, color: '#334155', weight: 1 } }).addTo(map);
        }
      } catch (e) {}

      const planeLayer = L.layerGroup().addTo(map);
      const selectedRouteLayer = L.layerGroup().addTo(map);
      let selectedFlightId = null;

      map.on('popupclose', function() {
        selectedFlightId = null;
        selectedRouteLayer.clearLayers();
      });

      const toRad = d => d * Math.PI / 180;
      const toDeg = r => r * 180 / Math.PI;

      function toMins(val) {
        if (!val) return 0;
        const s = String(val).trim();
        if (s.includes(':')) {
          const p = s.split(':').map(Number);
          return p.length === 3 ? p.at(0) * 60 + p.at(1) + p.at(2) / 60 : p.at(0) * 60 + p.at(1);
        }
        const n = parseFloat(s);
        return isNaN(n) ? 0 : n * 60;
      }

      function angDist(a, b) {
  const lat1 = toRad(a.lat), lon1 = toRad(a.lon), lat2 = toRad(b.lat), lon2 = toRad(b.lon);
  const h = Math.pow(Math.sin((lat1 - lat2) / 2), 2) + Math.cos(lat1) * Math.cos(lat2) * Math.pow(Math.sin((lon1 - lon2) / 2), 2);
  return toDeg(2 * Math.asin(Math.min(1, Math.sqrt(Math.max(0, h)))));
}
      function curveRoute(rawPts) {
        const dep = rawPts.at(0), arr = rawPts.at(rawPts.length - 1);
        const span = Math.max(angDist(dep, arr), 5);
        const clean = new Array(dep);
        const seen = new Set();
        seen.add(dep.ident);

        for (let i = 1; i < rawPts.length - 1; i++) {
          const pt = rawPts.at(i), prev = clean.at(clean.length - 1);
          if (pt.ident === dep.ident || pt.ident === arr.ident || seen.has(pt.ident)) continue;
          const distFromPrev = angDist(prev, pt);
          const distToArr = angDist(pt, arr);
          const prevDistToArr = angDist(prev, arr);
          // Only accept waypoints that move forward toward destination without wild jumps
          if (distFromPrev <= span * 0.85 && distToArr < prevDistToArr && (distFromPrev + distToArr) <= span * 1.35) {
            clean.push(pt);
            seen.add(pt.ident);
          }
        }
        clean.push(arr);

        const out = new Array();
        for (let i = 0; i < clean.length - 1; i++) {
          const p1 = clean.at(i), p2 = clean.at(i + 1);
          const lat1 = toRad(p1.lat), lon1 = toRad(p1.lon), lat2 = toRad(p2.lat), lon2 = toRad(p2.lon);
          const d = toRad(angDist(p1, p2));
          for (let s = 0; s <= 16; s++) {
            if (i > 0 && s === 0) continue;
            const f = s / 16;
            let lat = p1.lat, lon = p1.lon;
            if (d > 1e-6) {
              const A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
              const x = A * Math.cos(lat1) * Math.cos(lon1) + B * Math.cos(lat2) * Math.cos(lon2);
              const y = A * Math.cos(lat1) * Math.sin(lon1) + B * Math.cos(lat2) * Math.sin(lon2);
              const z = A * Math.sin(lat1) + B * Math.sin(lat2);
              lat = toDeg(Math.atan2(z, Math.sqrt(x * x + y * y)));
              lon = toDeg(Math.atan2(y, x));
            }
            if (out.length > 0) {
              const prevPt = out.at(out.length - 1);
              let diff = lon - prevPt.lon;
              while (diff > 180) diff -= 360;
              while (diff < -180) diff += 360;
              out.push({ lat: lat, lon: prevPt.lon + diff });
            } else {
              out.push({ lat: lat, lon: lon });
            }
          }
        }
        return { path: out, wps: clean };
      }

      function positionAlongDistance(pts, prog) {
        if (pts.length < 2 || prog <= 0) return { p1: pts.at(0), p2: pts.at(1), frac: 0 };
        if (prog >= 1) return { p1: pts.at(pts.length - 2), p2: pts.at(pts.length - 1), frac: 1 };

        const cum = new Array();
        cum.push(0);
        
        let total = 0;
        for (let i = 0; i < pts.length - 1; i++) {
          const step = angDist(pts.at(i), pts.at(i + 1));
          total += isNaN(step) ? 0 : step;
          cum.push(total);
        }
        if (total <= 0) return { p1: pts.at(0), p2: pts.at(1), frac: 0 };

        const target = prog * total;
        for (let i = 0; i < cum.length - 1; i++) {
          if (target >= cum.at(i) && target <= cum.at(i + 1)) {
            const seg = cum.at(i + 1) - cum.at(i);
            const frac = seg > 0 ? (target - cum.at(i)) / seg : 0;
            return { p1: pts.at(i), p2: pts.at(i + 1), frac: frac };
          }
        }
        return { p1: pts.at(pts.length - 2), p2: pts.at(pts.length - 1), frac: 1 };
      }

      function drawFlightRoute(pts, wps, depCode, arrCode) {
        selectedRouteLayer.clearLayers();
        const latLngs = pts.map(p => new Array(p.lat, p.lon));

        L.polyline(latLngs, { color: '#38bdf8', weight: 2, dashArray: '5, 8', opacity: 0.85 }).addTo(selectedRouteLayer);

        L.circleMarker(new Array(pts.at(0).lat, pts.at(0).lon), { radius: 4.5, color: '#22c55e', fillColor: '#22c55e', fillOpacity: 1 })
          .bindTooltip('DEP: ' + depCode).addTo(selectedRouteLayer);

        L.circleMarker(new Array(pts.at(pts.length - 1).lat, pts.at(pts.length - 1).lon), { radius: 4.5, color: '#ef4444', fillColor: '#ef4444', fillOpacity: 1 })
          .bindTooltip('ARR: ' + arrCode).addTo(selectedRouteLayer);

        for (let w = 1; w < wps.length - 1; w++) {
          L.circleMarker(new Array(wps.at(w).lat, wps.at(w).lon), { radius: 2.5, color: '#7dd3fc', fillColor: '#7dd3fc', fillOpacity: 0.8 })
            .bindTooltip(wps.at(w).ident).addTo(selectedRouteLayer);
        }
      }

      async function fetchLiveRows() {
        const sep = LIVE_API_URL.includes('?') ? '&' : '?';
        const reqUrl = LIVE_API_URL + sep + 't=' + Date.now();
        if (!isDiscord) {
          const resp = await fetch(reqUrl);
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          return await resp.json();
        }
        const firstResp = await fetch(reqUrl, { redirect: 'manual' });
        if (firstResp.status >= 300 && firstResp.status < 400) {
          const loc = firstResp.headers.get('location') || '';
          const parsed = new URL(loc);
          const proxiedResp = await fetch('/guser' + parsed.pathname + parsed.search);
          if (!proxiedResp.ok) throw new Error('Proxy HTTP ' + proxiedResp.status);
          return await proxiedResp.json();
        }
        if (!firstResp.ok) throw new Error('HTTP ' + firstResp.status);
        return await firstResp.json();
      }

      async function updateFlights() {
        try {
          const rows = await fetchLiveRows();

          planeLayer.clearLayers();
          let activeCount = 0;
          let stillSelected = false;

          for (let i = 1; i < rows.length; i++) {
            const r = rows.at(i);
            if (!r || r.length < 22 || !r.at(21)) continue;
            let raw; try { raw = JSON.parse(r.at(21)); } catch (e) { continue; }
            if (!Array.isArray(raw) || raw.length < 2) continue;

            const leftMin = toMins(r.at(13)), elapMin = toMins(r.at(14)), eftMin = toMins(r.at(8));
            if (leftMin <= 0) continue;
            const totMin = (elapMin + leftMin) > 0 ? (elapMin + leftMin) : eftMin;
            if (totMin <= 0) continue;
            const prog = Math.min(Math.max(elapMin / totMin, 0), 1);

            activeCount++;
            const flightId = r.at(19) || (r.at(2) + '_' + r.at(6) + '_' + r.at(7));
            const built = curveRoute(raw);
           const pts = built.path, wps = built.wps;
           const pos = positionAlongDistance(pts, prog);


            const p1 = pos.p1, p2 = pos.p2, frac = pos.frac;
            const cLat = p1.lat + (p2.lat - p1.lat) * frac, cLon = p1.lon + (p2.lon - p1.lon) * frac;
            const dLon = toRad(p2.lon - p1.lon);
            const hdg = (toDeg(Math.atan2(Math.sin(dLon) * Math.cos(toRad(p2.lat)), Math.cos(toRad(p1.lat)) * Math.sin(toRad(p2.lat)) - Math.sin(toRad(p1.lat)) * Math.cos(toRad(p2.lat)) * Math.cos(dLon))) + 360) % 360;

            const icon = L.divIcon({ className: 'plane-icon', html: `<div style="transform: rotate(${hdg - 45}deg);">✈️</div>`, iconSize: new Array(24, 24), iconAnchor: new Array(12, 12) });
            const marker = L.marker(new Array(cLat, cLon), { icon: icon })
              .bindPopup(`<div class="popup-header">${r.at(2)} • ${r.at(6)} ➔ ${r.at(7)}</div><div class="popup-row"><b>Pilot:</b> ${r.at(1)}</div><div class="popup-row"><b>Aircraft:</b> ${r.at(3)} (${r.at(4)})</div><div class="popup-row"><b>Livery:</b> ${r.at(5)}</div><div class="popup-row"><b>Elapsed / Left:</b> ${r.at(14)} / ${r.at(13)} (${Math.round(prog * 100)}%)</div>`)
              .addTo(planeLayer);

            marker.on('click', function() {
              selectedFlightId = flightId;
              drawFlightRoute(pts, wps, r.at(6), r.at(7));
            });

            if (selectedFlightId === flightId) {
              stillSelected = true;
              drawFlightRoute(pts, wps, r.at(6), r.at(7));
              marker.openPopup();
            }
          }

          if (selectedFlightId && !stillSelected) {
            selectedFlightId = null;
            selectedRouteLayer.clearLayers();
          }

          badge.textContent = `${activeCount} Active Flight${activeCount === 1 ? '' : 's'}`;
        } catch (err) {
          badge.textContent = 'Radar feed error';
        }
      }

      await updateFlights();
      setInterval(updateFlights, 15000);
    });
  </script>
</body>
</html>
